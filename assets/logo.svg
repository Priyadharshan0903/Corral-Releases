<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="fox-title">
  <title id="fox-title">Corral fox</title>
  <style>
    .fox-tail { transform-origin: 44px 81px; animation: tail-flick 7s ease-in-out infinite; }
    @keyframes tail-flick {
      0%, 76%, 92%, 100% { transform: rotate(0deg); }
      81% { transform: rotate(-7deg); }
      86% { transform: rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) { .fox-tail { animation: none; } }
  </style>
